name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q
  native:
    # Builds the clang-tidy plugin against the LLVM major it is pinned to and runs the CodeQL
    # fixture convergence suite (tests/test_convergence.py skips without the plugin).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-15 clang-tidy-15 libclang-15-dev llvm-15-dev cmake ninja-build
      - run: cmake -S native -B native/build -G Ninja -DClang_DIR=/usr/lib/llvm-15/lib/cmake/clang -DCMAKE_BUILD_TYPE=Release && cmake --build native/build
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: python3 native/test/run_fixtures.py --clang-tidy /usr/lib/llvm-15/bin/clang-tidy
      - run: CLANG_TIDY=/usr/lib/llvm-15/bin/clang-tidy python -m pytest -q tests/test_convergence.py tests/test_clang_tidy.py
